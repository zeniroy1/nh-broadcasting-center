    <rect x="798" y="414" width="330" height="62" fill="#fbfcfe" stroke="#d0d5dd"/>
    <rect x="822" y="434" width="54" height="22" fill="#167647"/>
    <text x="833" y="450" font-size="12" font-weight="700" fill="#ffffff">PASS</text>
    <text x="896" y="442" font-weight="700" fill="#182230">시각화 UI</text>
