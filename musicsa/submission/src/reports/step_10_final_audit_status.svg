    <rect x="459" y="434" width="54" height="22" fill="#167647"/>
    <text x="470" y="450" font-size="12" font-weight="700" fill="#ffffff">PASS</text>
    <text x="533" y="442" font-weight="700" fill="#182230">내부 데이터 경계</text>
