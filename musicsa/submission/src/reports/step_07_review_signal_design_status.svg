<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Step 07 Review Signal Design</title>
  <desc id="desc">Musinsa roadmap step 7 status diagram showing review signal categories, proxy metrics, confidence caps, and validation results.</desc>
  <rect width="1200" height="760" fill="#f5f7fa"/>
  <rect x="40" y="36" width="1120" height="688" fill="#ffffff" stroke="#d7dde8"/>
