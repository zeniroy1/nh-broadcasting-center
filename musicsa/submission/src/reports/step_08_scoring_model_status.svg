<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Step 08 Scoring Model</title>
  <desc id="desc">Musinsa roadmap step 8 status diagram showing review purchase evidence, buyer context signals, sample scores, confidence cap, and validation results.</desc>
  <rect width="1200" height="760" fill="#f5f7fa"/>
  <rect x="40" y="36" width="1120" height="688" fill="#ffffff" stroke="#d7dde8"/>
  <text x="72" y="88" font-family="Arial, Noto Sans KR, sans-serif" font-size="30" font-weight="700" fill="#172033">8단계 점수화 모델 설계</text>
  <text x="72" y="120" font-family="Arial, Noto Sans KR, sans-serif" font-size="15" fill="#667085">리뷰 수와 리뷰 키워드를 공개 대체 지표로 반영해 설명 가능한 final_score를 계산합니다.</text>
  <rect x="1014" y="64" width="104" height="34" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="1038" y="86" font-family="Arial, Noto Sans KR, sans-serif" font-size="14" font-weight="700" fill="#166534">검수 통과</text>

  <g font-family="Arial, Noto Sans KR, sans-serif">
    <rect x="72" y="154" width="240" height="92" fill="#fbfcfe" stroke="#d7dde8"/>
    <text x="96" y="195" font-size="32" font-weight="700" fill="#172033">9</text>
    <text x="96" y="222" font-size="14" fill="#667085">점수 구성 요소</text>
    <rect x="336" y="154" width="240" height="92" fill="#fbfcfe" stroke="#d7dde8"/>
    <text x="360" y="195" font-size="32" font-weight="700" fill="#172033">100</text>
    <text x="360" y="222" font-size="14" fill="#667085">가중치 총합</text>
    <rect x="600" y="154" width="240" height="92" fill="#fbfcfe" stroke="#d7dde8"/>
    <text x="624" y="195" font-size="32" font-weight="700" fill="#172033">88%</text>
    <text x="624" y="222" font-size="14" fill="#667085">최종 신뢰도 상한</text>
    <rect x="864" y="154" width="240" height="92" fill="#fbfcfe" stroke="#d7dde8"/>
    <text x="888" y="195" font-size="32" font-weight="700" fill="#172033">44</text>
    <text x="888" y="222" font-size="14" fill="#667085">누적 자동 테스트</text>
  </g>

  <text x="72" y="300" font-family="Arial, Noto Sans KR, sans-serif" font-size="19" font-weight="700" fill="#172033">점수화 흐름</text>
  <g font-family="Arial, Noto Sans KR, sans-serif">
    <rect x="72" y="324" width="180" height="92" fill="#ffffff" stroke="#d7dde8"/>
    <text x="96" y="354" font-size="15" font-weight="700" fill="#172033">Proxy</text>
    <text x="96" y="380" font-size="13" fill="#667085">리뷰 구매 근거</text>
    <line x1="252" y1="370" x2="284" y2="370" stroke="#667085"/>
    <polygon points="284,370 274,364 274,376" fill="#667085"/>

    <rect x="284" y="324" width="180" height="92" fill="#ffffff" stroke="#d7dde8"/>
    <text x="308" y="354" font-size="15" font-weight="700" fill="#172033">Review</text>
    <text x="308" y="380" font-size="13" fill="#667085">구매자 타겟</text>
    <line x1="464" y1="370" x2="496" y2="370" stroke="#667085"/>
    <polygon points="496,370 486,364 486,376" fill="#667085"/>

    <rect x="496" y="324" width="180" height="92" fill="#ffffff" stroke="#d7dde8"/>
    <text x="520" y="354" font-size="15" font-weight="700" fill="#172033">Public</text>
    <text x="520" y="380" font-size="13" fill="#667085">가격/배송/품절</text>
    <line x1="676" y1="370" x2="708" y2="370" stroke="#667085"/>
    <polygon points="708,370 698,364 698,376" fill="#667085"/>

    <rect x="708" y="324" width="180" height="92" fill="#ffffff" stroke="#d7dde8"/>
    <text x="732" y="354" font-size="15" font-weight="700" fill="#172033">Weight</text>
    <text x="732" y="380" font-size="13" fill="#667085">JSON 가중치</text>
    <line x1="888" y1="370" x2="920" y2="370" stroke="#667085"/>
    <polygon points="920,370 910,364 910,376" fill="#667085"/>

    <rect x="920" y="324" width="180" height="92" fill="#ffffff" stroke="#d7dde8"/>
    <text x="944" y="354" font-size="15" font-weight="700" fill="#172033">Output</text>
    <text x="944" y="380" font-size="13" fill="#667085">final_score</text>
  </g>

  <text x="72" y="470" font-family="Arial, Noto Sans KR, sans-serif" font-size="19" font-weight="700" fill="#172033">샘플 비교 결과</text>
  <g font-family="Arial, Noto Sans KR, sans-serif" font-size="14">
    <rect x="72" y="496" width="1056" height="48" fill="#fbfcfe" stroke="#d7dde8"/>
    <text x="96" y="526" font-weight="700" fill="#667085">상품</text>
    <text x="570" y="526" font-weight="700" fill="#667085">final_score</text>
    <text x="760" y="526" font-weight="700" fill="#667085">confidence</text>
    <text x="940" y="526" font-weight="700" fill="#667085">상태</text>

    <text x="96" y="574" fill="#172033">베이직 무지 반팔 티셔츠 블랙</text>
    <rect x="570" y="552" width="64" height="28" fill="#15803d"/>
    <text x="593" y="571" fill="#ffffff" font-weight="700">96</text>
    <text x="760" y="574" fill="#172033">82%</text>
    <text x="940" y="574" fill="#172033">rank_ready</text>

    <text x="96" y="622" fill="#172033">그래픽 로고 반팔 티셔츠 블랙</text>
    <rect x="570" y="600" width="64" height="28" fill="#b45309"/>
    <text x="593" y="619" fill="#ffffff" font-weight="700">68</text>
    <text x="760" y="622" fill="#172033">76%</text>
    <text x="940" y="622" fill="#172033">ad penalty</text>

    <text x="96" y="682" fill="#667085">리뷰 수는 구매 후 반응 누적 근거지만 실제 구매자 수나 판매량으로 단정하지 않습니다.</text>
  </g>
</svg>
