<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Step 03 Proxy Metric Mapping Status</title>
  <desc id="desc">공개 지표와 대체 지표 매핑 구현 상태 요약</desc>
  <rect width="960" height="540" fill="#f7f6f2"/>
  <rect x="40" y="36" width="880" height="468" rx="8" fill="#ffffff" stroke="#d9d6cc"/>
  <text x="72" y="88" fill="#161616" font-family="Arial, Malgun Gothic, sans-serif" font-size="32" font-weight="700">Step 03 대체 지표 매핑</text>
  <text x="72" y="124" fill="#666b73" font-family="Arial, Malgun Gothic, sans-serif" font-size="18">추정 지표마다 score와 confidence_percent를 함께 계산</text>

  <rect x="72" y="160" width="190" height="104" rx="8" fill="#d9f3ee"/>
  <text x="92" y="196" fill="#0f766e" font-family="Arial, Malgun Gothic, sans-serif" font-size="17" font-weight="700">추정 지표</text>
  <text x="92" y="244" fill="#0f766e" font-family="Arial, Malgun Gothic, sans-serif" font-size="42" font-weight="700">5</text>

  <rect x="286" y="160" width="190" height="104" rx="8" fill="#dbeafe"/>
  <text x="306" y="196" fill="#1d4ed8" font-family="Arial, Malgun Gothic, sans-serif" font-size="17" font-weight="700">테스트</text>
  <text x="306" y="244" fill="#1d4ed8" font-family="Arial, Malgun Gothic, sans-serif" font-size="42" font-weight="700">12/12</text>

  <rect x="500" y="160" width="190" height="104" rx="8" fill="#fef3c7"/>
  <text x="520" y="196" fill="#92400e" font-family="Arial, Malgun Gothic, sans-serif" font-size="17" font-weight="700">최대 신뢰도</text>
  <text x="520" y="244" fill="#92400e" font-family="Arial, Malgun Gothic, sans-serif" font-size="42" font-weight="700">95%</text>

  <rect x="714" y="160" width="174" height="104" rx="8" fill="#fee2e2"/>
  <text x="734" y="196" fill="#b91c1c" font-family="Arial, Malgun Gothic, sans-serif" font-size="17" font-weight="700">내부지표 상한</text>
  <text x="734" y="244" fill="#b91c1c" font-family="Arial, Malgun Gothic, sans-serif" font-size="42" font-weight="700">필수</text>

  <line x1="72" y1="304" x2="888" y2="304" stroke="#d9d6cc"/>
  <text x="72" y="344" fill="#161616" font-family="Arial, Malgun Gothic, sans-serif" font-size="22" font-weight="700">샘플 결과</text>
  <text x="72" y="384" fill="#161616" font-family="Arial, Malgun Gothic, sans-serif" font-size="18">목적 적합도: score 100 / confidence 95%</text>
  <text x="72" y="418" fill="#161616" font-family="Arial, Malgun Gothic, sans-serif" font-size="18">40대 남성 적합도: score 99 / confidence 85%</text>
  <text x="72" y="452" fill="#161616" font-family="Arial, Malgun Gothic, sans-serif" font-size="18">반품 리스크 낮음: score 92 / confidence 75%</text>

  <circle cx="842" cy="410" r="30" fill="#0f766e"/>
  <path d="M829 410l9 9 19-22" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
