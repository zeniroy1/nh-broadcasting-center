    <text x="96" y="222" font-size="14" fill="#667085">리뷰 신호 카테고리</text>
    <rect x="336" y="154" width="240" height="92" fill="#fbfcfe" stroke="#d7dde8"/>
    <text x="360" y="195" font-size="32" font-weight="700" fill="#172033">4</text>
    <text x="360" y="222" font-size="14" fill="#667085">리뷰 보조 지표</text>
    <rect x="600" y="154" width="240" height="92" fill="#fbfcfe" stroke="#d7dde8"/>
    <text x="624" y="195" font-size="32" font-weight="700" fill="#172033">80%</text>
    <text x="624" y="222" font-size="14" fill="#667085">신뢰도 상한</text>
    <rect x="864" y="154" width="240" height="92" fill="#fbfcfe" stroke="#d7dde8"/>
    <text x="888" y="195" font-size="32" font-weight="700" fill="#172033">35</text>
    <text x="888" y="222" font-size="14" fill="#667085">누적 자동 테스트</text>
  </g>

  <text x="72" y="300" font-family="Arial, Noto Sans KR, sans-serif" font-size="19" font-weight="700" fill="#172033">리뷰 신호 흐름</text>
