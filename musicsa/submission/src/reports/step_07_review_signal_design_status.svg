  <text x="72" y="470" font-family="Arial, Noto Sans KR, sans-serif" font-size="19" font-weight="700" fill="#172033">대표 보조 지표</text>
  <g font-family="Arial, Noto Sans KR, sans-serif" font-size="14">
    <rect x="72" y="496" width="1056" height="48" fill="#fbfcfe" stroke="#d7dde8"/>
