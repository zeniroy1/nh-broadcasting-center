  <text x="72" y="636" font-family="Arial, Noto Sans KR, sans-serif" font-size="19" font-weight="700" fill="#182230">다음 단계 정책</text>
  <text x="72" y="668" font-family="Arial, Noto Sans KR, sans-serif" font-size="14" fill="#667085">사용자 승인 전에는 추가 구현, submission.zip 재생성, Google Drive 업로드를 진행하지 않습니다.</text>
