<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Musinsa Buyer App Flow</title>
  <desc id="desc">Buyer-facing flow for public Musinsa signal collection, scoring, comparison, and shortlist detail.</desc>
  <rect width="1200" height="760" fill="#ffffff"/>
  <text x="64" y="72" font-family="Arial, Noto Sans KR, sans-serif" font-size="28" font-weight="700" fill="#182230">실사용 수집기 + 구매자 UI</text>
  <text x="64" y="106" font-family="Arial, Noto Sans KR, sans-serif" font-size="14" fill="#667085">공개 HTML/JSON 신호만 수집하고, 내부 데이터는 추정하지 않습니다.</text>

  <g font-family="Arial, Noto Sans KR, sans-serif">
    <rect x="64" y="148" width="146" height="72" rx="8" fill="#f8fafc" stroke="#d0d5dd"/>
    <text x="86" y="178" font-size="14" font-weight="700" fill="#182230">구매 의도</text>
    <text x="86" y="202" font-size="12" fill="#667085">검은색 무지티</text>

    <rect x="242" y="148" width="146" height="72" rx="8" fill="#f8fafc" stroke="#d0d5dd"/>
    <text x="264" y="178" font-size="14" font-weight="700" fill="#182230">검색어 후보</text>
    <text x="264" y="202" font-size="12" fill="#667085">11개 query</text>

    <rect x="420" y="148" width="146" height="72" rx="8" fill="#f8fafc" stroke="#d0d5dd"/>
    <text x="442" y="178" font-size="14" font-weight="700" fill="#182230">공개 수집</text>
    <text x="442" y="202" font-size="12" fill="#667085">HTML/JSON</text>

    <rect x="598" y="148" width="146" height="72" rx="8" fill="#f8fafc" stroke="#d0d5dd"/>
    <text x="620" y="178" font-size="14" font-weight="700" fill="#182230">정규화</text>
    <text x="620" y="202" font-size="12" fill="#667085">상품 후보</text>

    <rect x="776" y="148" width="146" height="72" rx="8" fill="#f8fafc" stroke="#d0d5dd"/>
    <text x="798" y="178" font-size="14" font-weight="700" fill="#182230">점수화</text>
    <text x="798" y="202" font-size="12" fill="#667085">신뢰도 포함</text>

    <rect x="954" y="148" width="146" height="72" rx="8" fill="#f8fafc" stroke="#d0d5dd"/>
    <text x="976" y="178" font-size="14" font-weight="700" fill="#182230">구매 판단</text>
    <text x="976" y="202" font-size="12" fill="#667085">5개 → 3개</text>

    <g stroke="#98a2b3" stroke-width="2">
      <line x1="210" y1="184" x2="242" y2="184"/>
      <line x1="388" y1="184" x2="420" y2="184"/>
      <line x1="566" y1="184" x2="598" y2="184"/>
      <line x1="744" y1="184" x2="776" y2="184"/>
      <line x1="922" y1="184" x2="954" y2="184"/>
    </g>
  </g>

  <g font-family="Arial, Noto Sans KR, sans-serif">
    <text x="64" y="286" font-size="20" font-weight="700" fill="#182230">5개 후보 세로 비교</text>
    <line x1="64" y1="586" x2="534" y2="586" stroke="#d0d5dd"/>
    <rect x="96" y="298" width="48" height="288" rx="8" fill="#167647"/>
    <rect x="178" y="325" width="48" height="261" rx="8" fill="#175cd3"/>
    <rect x="260" y="343" width="48" height="243" rx="8" fill="#b54708"/>
    <rect x="342" y="343" width="48" height="243" rx="8" fill="#7a5af8"/>
    <rect x="424" y="382" width="48" height="204" rx="8" fill="#c11574"/>
    <text x="106" y="290" font-size="14" font-weight="700" fill="#182230">96</text>
    <text x="188" y="317" font-size="14" font-weight="700" fill="#182230">87</text>
    <text x="270" y="335" font-size="14" font-weight="700" fill="#182230">81</text>
    <text x="352" y="335" font-size="14" font-weight="700" fill="#182230">81</text>
    <text x="434" y="374" font-size="14" font-weight="700" fill="#182230">68</text>
    <text x="92" y="616" font-size="12" fill="#667085">베이직</text>
    <text x="180" y="616" font-size="12" fill="#667085">코튼</text>
    <text x="256" y="616" font-size="12" fill="#667085">데일리</text>
    <text x="344" y="616" font-size="12" fill="#667085">쿨링</text>
    <text x="422" y="616" font-size="12" fill="#667085">그래픽</text>
  </g>

  <g font-family="Arial, Noto Sans KR, sans-serif">
    <text x="636" y="286" font-size="20" font-weight="700" fill="#182230">3개 shortlist 세부 지표</text>
    <g transform="translate(650 338)">
      <circle cx="70" cy="70" r="60" fill="none" stroke="#167647" stroke-width="24"/>
      <circle cx="70" cy="70" r="60" fill="none" stroke="#175cd3" stroke-width="24" stroke-dasharray="80 300" transform="rotate(80 70 70)"/>
      <circle cx="70" cy="70" r="60" fill="none" stroke="#b54708" stroke-width="24" stroke-dasharray="70 300" transform="rotate(160 70 70)"/>
      <circle cx="70" cy="70" r="60" fill="none" stroke="#7a5af8" stroke-width="24" stroke-dasharray="58 300" transform="rotate(230 70 70)"/>
      <text x="48" y="76" font-size="18" font-weight="700" fill="#182230">96</text>
      <text x="34" y="154" font-size="13" fill="#667085">베이직</text>
    </g>
    <g transform="translate(820 338)">
      <circle cx="70" cy="70" r="60" fill="none" stroke="#167647" stroke-width="24"/>
      <circle cx="70" cy="70" r="60" fill="none" stroke="#175cd3" stroke-width="24" stroke-dasharray="70 300" transform="rotate(74 70 70)"/>
      <circle cx="70" cy="70" r="60" fill="none" stroke="#b54708" stroke-width="24" stroke-dasharray="68 300" transform="rotate(145 70 70)"/>
      <circle cx="70" cy="70" r="60" fill="none" stroke="#7a5af8" stroke-width="24" stroke-dasharray="58 300" transform="rotate(216 70 70)"/>
      <text x="48" y="76" font-size="18" font-weight="700" fill="#182230">87</text>
      <text x="44" y="154" font-size="13" fill="#667085">코튼</text>
    </g>
    <g transform="translate(990 338)">
      <circle cx="70" cy="70" r="60" fill="none" stroke="#167647" stroke-width="24"/>
      <circle cx="70" cy="70" r="60" fill="none" stroke="#175cd3" stroke-width="24" stroke-dasharray="58 300" transform="rotate(78 70 70)"/>
      <circle cx="70" cy="70" r="60" fill="none" stroke="#b54708" stroke-width="24" stroke-dasharray="72 300" transform="rotate(140 70 70)"/>
      <circle cx="70" cy="70" r="60" fill="none" stroke="#7a5af8" stroke-width="24" stroke-dasharray="58 300" transform="rotate(220 70 70)"/>
      <text x="48" y="76" font-size="18" font-weight="700" fill="#182230">81</text>
      <text x="34" y="154" font-size="13" fill="#667085">데일리</text>
    </g>
    <rect x="638" y="548" width="492" height="70" rx="8" fill="#f8fafc" stroke="#d0d5dd"/>
    <text x="660" y="578" font-size="13" fill="#667085">목적 / 리뷰 / 가격 / 타겟 / 리스크를 분리해 표시</text>
    <text x="660" y="602" font-size="13" fill="#667085">실제 구매자 수와 실제 판매량은 공개 대체 지표로 환산하지 않음</text>
  </g>
</svg>
