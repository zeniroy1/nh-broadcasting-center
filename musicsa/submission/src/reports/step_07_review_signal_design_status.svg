    <text x="570" y="622" fill="#172033">56%</text>
    <text x="760" y="622" fill="#172033">리뷰 표현 기반 보조 지표</text>

    <text x="96" y="670" fill="#172033">age_40s_context_review_score</text>
    <text x="430" y="670" fill="#172033">77</text>
    <text x="570" y="670" fill="#172033">64%</text>
    <text x="760" y="670" fill="#172033">실제 40대 구매자 수 아님</text>
