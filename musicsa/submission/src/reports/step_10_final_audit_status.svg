    <text x="624" y="195" font-size="32" font-weight="700" fill="#182230">7</text>
    <text x="624" y="222" font-size="14" fill="#667085">감사 항목</text>
    <rect x="864" y="154" width="240" height="92" fill="#fbfcfe" stroke="#d0d5dd"/>
