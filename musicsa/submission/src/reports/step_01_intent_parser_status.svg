<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Step 01 Intent Parser Status</title>
  <desc id="desc">사용자 요청 해석 모듈의 구현 정도와 검수 결과 요약</desc>
  <rect width="960" height="540" fill="#f7f7f4"/>
  <rect x="40" y="36" width="880" height="468" rx="8" fill="#ffffff" stroke="#d9d9d2"/>
  <text x="72" y="92" fill="#171717" font-family="Arial, Malgun Gothic, sans-serif" font-size="34" font-weight="700">Step 01 사용자 요청 해석 모듈</text>
  <text x="72" y="128" fill="#666a73" font-family="Arial, Malgun Gothic, sans-serif" font-size="18">자연어 구매 요청을 구조화된 무신사 검색 조건으로 변환</text>

  <rect x="72" y="166" width="240" height="110" rx="8" fill="#d9f3ee"/>
  <text x="96" y="204" fill="#0f766e" font-family="Arial, Malgun Gothic, sans-serif" font-size="18" font-weight="700">구현 정도</text>
  <text x="96" y="252" fill="#0f766e" font-family="Arial, Malgun Gothic, sans-serif" font-size="42" font-weight="700">100%</text>

  <rect x="360" y="166" width="240" height="110" rx="8" fill="#eef2ff"/>
  <text x="384" y="204" fill="#3730a3" font-family="Arial, Malgun Gothic, sans-serif" font-size="18" font-weight="700">테스트</text>
  <text x="384" y="252" fill="#3730a3" font-family="Arial, Malgun Gothic, sans-serif" font-size="42" font-weight="700">3/3</text>

  <rect x="648" y="166" width="240" height="110" rx="8" fill="#fef3c7"/>
  <text x="672" y="204" fill="#92400e" font-family="Arial, Malgun Gothic, sans-serif" font-size="18" font-weight="700">목적 부합도</text>
  <text x="672" y="252" fill="#92400e" font-family="Arial, Malgun Gothic, sans-serif" font-size="42" font-weight="700">100%</text>

  <line x1="72" y1="316" x2="888" y2="316" stroke="#d9d9d2"/>
  <text x="72" y="356" fill="#171717" font-family="Arial, Malgun Gothic, sans-serif" font-size="22" font-weight="700">검수 체크</text>
  <text x="72" y="394" fill="#171717" font-family="Arial, Malgun Gothic, sans-serif" font-size="18">정적 검사 통과</text>
  <text x="72" y="426" fill="#171717" font-family="Arial, Malgun Gothic, sans-serif" font-size="18">구현 스킬 실현 시뮬레이션 통과</text>
  <text x="72" y="458" fill="#171717" font-family="Arial, Malgun Gothic, sans-serif" font-size="18">불필요한 주석 없음, 신규 경로 사용으로 충돌 없음</text>

  <circle cx="844" cy="386" r="28" fill="#0f766e"/>
  <path d="M831 386l9 9 19-22" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
