android {
    namespace "com.example.nh_reminder"
    compileSdk 34

    defaultConfig {
        applicationId "com.example.nh_reminder"
        minSdk 26          // Android 8.0+ (UsageStats + 백그라운드 위치)
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
}
