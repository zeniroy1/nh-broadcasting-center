<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>HAMSHARE 구현상황</title>
  <style>
    :root{color-scheme:dark;--bg:#07111f;--panel:#0d1b2d;--line:#20344d;--text:#eaf2ff;--muted:#91a7c0;--blue:#55a7ff;--green:#43d39e;--amber:#ffc857}
    *{box-sizing:border-box} body{margin:0;background:radial-gradient(circle at 15% 0,#12345a 0,transparent 35%),var(--bg);font-family:Segoe UI,Malgun Gothic,sans-serif;color:var(--text)}
    main{width:min(1180px,calc(100% - 32px));margin:28px auto 60px}.top{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:18px}
    h1{margin:0;font-size:clamp(28px,5vw,54px);letter-spacing:-2px}.tag{color:var(--green);font-weight:700}.stamp{color:var(--muted);text-align:right}
    .card{background:rgba(13,27,45,.92);border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 60px #0007;overflow:hidden}
    object{display:block;width:100%;min-height:760px;border:0}.notes{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:14px}.note{padding:18px;border-radius:14px;background:#0d1b2d;border:1px solid var(--line)}
    .note b{display:block;margin-bottom:8px}.note span{color:var(--muted);line-height:1.6}@media(max-width:760px){.notes{grid-template-columns:1fr}.top{align-items:start;flex-direction:column}.stamp{text-align:left}}
  </style>
</head>
<body>
<main>
  <div class="top"><div><div class="tag">LOCAL-FIRST FILE TRANSFER</div><h1>HAMSHARE 구축 현황</h1></div><div class="stamp">마지막 갱신<br><strong>2026-06-19 · S23+ 설치 완료</strong></div></div>
  <div class="card"><object data="progress.svg" type="image/svg+xml" aria-label="HAMSHARE 10단계 구현 진행도"></object></div>
  <section class="notes">
    <div class="note"><b>현재 작업</b><span>S23+ APK 설치 완료 · PC의 S23+ 핫스팟 연결 대기</span></div>
    <div class="note"><b>성능 목표</b><span>5GHz 핫스팟에서 10MB/s 이상, 목표 20~40MB/s</span></div>
    <div class="note"><b>실기기 상태</b><span>SM-S916N ADB 인증, APK 설치·실행, Windows 포트 57321 대기 확인</span></div>
  </section>
</main>
</body>
</html>
