  <text x="240" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#1f2d3d">설정 화면</text>
  <rect x="130" y="145" width="220" height="58" rx="16" fill="#eef5fb"/>
  <text x="240" y="181" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#1f2d3d">이 출처 허용</text>
