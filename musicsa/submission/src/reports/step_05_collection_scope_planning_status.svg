<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Step 05 Collection Scope Planning</title>
  <desc id="desc">Musinsa product roadmap step 5 status diagram showing collection jobs, source scope, policies, and validation results.</desc>
  <rect width="1200" height="760" fill="#f7f8fb"/>
