    <text x="430" y="526" font-weight="700" fill="#667085">score</text>
    <text x="570" y="526" font-weight="700" fill="#667085">confidence</text>
    <text x="760" y="526" font-weight="700" fill="#667085">한계</text>

    <text x="96" y="574" fill="#172033">size_fit_review_score</text>
    <text x="430" y="574" fill="#172033">96</text>
    <text x="570" y="574" fill="#172033">60%</text>
    <text x="760" y="574" fill="#172033">실제 교환/반품률 아님</text>

    <text x="96" y="622" fill="#172033">fabric_risk_review_score</text>
