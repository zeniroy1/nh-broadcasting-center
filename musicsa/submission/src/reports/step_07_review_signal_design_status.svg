    <rect x="72" y="324" width="180" height="92" fill="#ffffff" stroke="#d7dde8"/>
    <text x="96" y="354" font-size="15" font-weight="700" fill="#172033">Detail</text>
    <text x="96" y="380" font-size="13" fill="#667085">product_id/url</text>
    <line x1="252" y1="370" x2="284" y2="370" stroke="#667085"/>
