<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Step 02 Public Signal Catalog Status</title>
  <desc id="desc">무신사 공개 데이터 구조와 지표 카탈로그 구현 상태 요약</desc>
  <rect width="960" height="540" fill="#f5f7fb"/>
  <rect x="40" y="36" width="880" height="468" rx="8" fill="#ffffff" stroke="#d8dee8"/>
  <text x="72" y="88" fill="#15171a" font-family="Arial, Malgun Gothic, sans-serif" font-size="32" font-weight="700">Step 02 공개 지표 카탈로그</text>
  <text x="72" y="124" fill="#626976" font-family="Arial, Malgun Gothic, sans-serif" font-size="18">직접 지표 / 정제 지표 / 추정 지표를 분류하고 신뢰도 정책을 적용</text>

  <rect x="72" y="162" width="188" height="104" rx="8" fill="#d9f3ee"/>
  <text x="92" y="198" fill="#0f766e" font-family="Arial, Malgun Gothic, sans-serif" font-size="17" font-weight="700">데이터 소스</text>
  <text x="92" y="246" fill="#0f766e" font-family="Arial, Malgun Gothic, sans-serif" font-size="42" font-weight="700">6</text>

  <rect x="284" y="162" width="188" height="104" rx="8" fill="#eef2ff"/>
  <text x="304" y="198" fill="#3730a3" font-family="Arial, Malgun Gothic, sans-serif" font-size="17" font-weight="700">전체 지표</text>
  <text x="304" y="246" fill="#3730a3" font-family="Arial, Malgun Gothic, sans-serif" font-size="42" font-weight="700">23</text>

  <rect x="496" y="162" width="188" height="104" rx="8" fill="#fef3c7"/>
  <text x="516" y="198" fill="#92400e" font-family="Arial, Malgun Gothic, sans-serif" font-size="17" font-weight="700">추정 지표</text>
  <text x="516" y="246" fill="#92400e" font-family="Arial, Malgun Gothic, sans-serif" font-size="42" font-weight="700">5</text>

  <rect x="708" y="162" width="180" height="104" rx="8" fill="#dcfce7"/>
  <text x="728" y="198" fill="#166534" font-family="Arial, Malgun Gothic, sans-serif" font-size="17" font-weight="700">테스트</text>
  <text x="728" y="246" fill="#166534" font-family="Arial, Malgun Gothic, sans-serif" font-size="42" font-weight="700">4/4</text>

  <line x1="72" y1="306" x2="888" y2="306" stroke="#d8dee8"/>
  <text x="72" y="346" fill="#15171a" font-family="Arial, Malgun Gothic, sans-serif" font-size="22" font-weight="700">지표 풀</text>
  <text x="72" y="386" fill="#0f766e" font-family="Arial, Malgun Gothic, sans-serif" font-size="19" font-weight="700">직접 12</text>
  <text x="180" y="386" fill="#15171a" font-family="Arial, Malgun Gothic, sans-serif" font-size="18">가격, 리뷰 수, 평점, 랭킹 순위, 배송</text>
  <text x="72" y="422" fill="#3730a3" font-family="Arial, Malgun Gothic, sans-serif" font-size="19" font-weight="700">정제 6</text>
  <text x="180" y="422" fill="#15171a" font-family="Arial, Malgun Gothic, sans-serif" font-size="18">색상, 스타일, 핏, 소재, 재구매 언급</text>
  <text x="72" y="458" fill="#92400e" font-family="Arial, Malgun Gothic, sans-serif" font-size="19" font-weight="700">추정 5</text>
  <text x="180" y="458" fill="#15171a" font-family="Arial, Malgun Gothic, sans-serif" font-size="18">목적 적합도, 40대 남성 적합도, 구매 신뢰도</text>

  <circle cx="842" cy="416" r="30" fill="#0f766e"/>
  <path d="M829 416l9 9 19-22" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
