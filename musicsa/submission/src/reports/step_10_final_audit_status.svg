    <rect x="96" y="522" width="54" height="22" fill="#167647"/>
    <text x="107" y="538" font-size="12" font-weight="700" fill="#ffffff">PASS</text>
    <text x="170" y="530" font-weight="700" fill="#182230">라인 수 정리</text>
